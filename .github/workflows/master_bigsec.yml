name: Build and deploy to Azure Web App - bigsec

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Azure login via OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and build
        run: |
          # Hoisted: a flat node_modules survives zipping; Bun's default links do not.
          bun install --frozen-lockfile --linker hoisted
          cd apps/web && bun run build

      # App Service's Node image has no Bun: the binary ships with the app, and
      # startup.sh runs the stack against the site built above.
      - name: Package
        run: |
          mkdir -p bin
          cp "$(command -v bun)" bin/bun
          cat > startup.sh <<'EOF'
          #!/bin/sh
          set -e
          cp /home/site/wwwroot/bin/bun /tmp/bun
          chmod +x /tmp/bun
          cd /home/site/wwwroot
          export PATH="/tmp:$PATH" SKIP_BUILD=1
          export DATABASE_PATH="${DATABASE_PATH:-/tmp/bigsec/prestocks.db}"
          exec bun run start
          EOF
          zip -qr ../release.zip . -x '.git/*'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88F420095141493EB7B2B84133835579 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2264DAFEE294864AD93518016233FF6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AF6F5A8B73864DF79C2EF7AB9CDC8D43 }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: bigsec
          slot-name: Production
          package: ../release.zip
          startup-command: sh /home/site/wwwroot/startup.sh
